[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chromoseg"
version = "0.1.0"
description = "Real-Time Instance Segmentation & Automated Cytogenetics Engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Margot Bonilla" }
]
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.3.0",
    "opencv-python-headless>=4.9.0",
    "albumentations>=1.4.0",
    "wandb>=0.16.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "gradio>=4.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "ipykernel>=6.29.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["chromoseg*"]
